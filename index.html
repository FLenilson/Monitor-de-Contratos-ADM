<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="robots" content="noindex,nofollow"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contratos Recorrentes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{--bg:#EEF3F1;--panel:#FFFFFF;--panel2:#F6F9F8;--ink:#14231E;--mute:#5A6B65;--line:#D6E0DC;--acc:#0B6B53;--acc-ink:#FFFFFF;--acc-soft:#DDEFE8;--ok:#1B7A4C;--ok-s:#DCF1E5;--warn:#9A6206;--warn-s:#FBEFD5;--crit:#B42318;--crit-s:#FDE3E0;--info:#2A5B9A;--info-s:#E1EBF8;--neu-s:#E7ECEA;--shadow:0 1px 2px rgba(20,35,30,.06),0 4px 14px rgba(20,35,30,.05);--f-c:"IBM Plex Sans Condensed","Arial Narrow",Arial,sans-serif;--f-b:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;--f-m:"IBM Plex Mono",ui-monospace,Consolas,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#0D1614;--panel:#141F1C;--panel2:#18251F;--ink:#E2ECE8;--mute:#8FA39C;--line:#26342F;--acc:#3DBE95;--acc-ink:#062019;--acc-soft:#16362C;--ok:#52C58E;--ok-s:#13301F;--warn:#E3AA4B;--warn-s:#33270F;--crit:#F2705F;--crit-s:#3A1714;--info:#80AAE8;--info-s:#152640;--neu-s:#1E2A26;--shadow:none}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#0D1614;--panel:#141F1C;--panel2:#18251F;--ink:#E2ECE8;--mute:#8FA39C;--line:#26342F;--acc:#3DBE95;--acc-ink:#062019;--acc-soft:#16362C;--ok:#52C58E;--ok-s:#13301F;--warn:#E3AA4B;--warn-s:#33270F;--crit:#F2705F;--crit-s:#3A1714;--info:#80AAE8;--info-s:#152640;--neu-s:#1E2A26;--shadow:none}
*{box-sizing:border-box}[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:13px/1.4 var(--f-b);margin:0}
.wrap{padding-inline:16px;padding-block:0 32px;max-width:1500px;margin:0 auto}
button,input,select,textarea{font:inherit;color:inherit}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line);padding-block:10px 0}
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;flex-direction:column;margin-right:auto;padding-left:14px;border-left:1px solid var(--line)}
.logo{height:40px;width:auto;background:#fff;border-radius:6px;padding:3px 6px;box-sizing:content-box}
@media (max-width:560px){.logo{height:30px}.brand{border-left:0;padding-left:0}}
.brand b{font:700 18px/1.1 var(--f-c);letter-spacing:.2px}
.brand span{font:500 11px var(--f-c);color:var(--mute);letter-spacing:.8px;text-transform:uppercase}
.compnav{display:flex;align-items:center;border:1px solid var(--line);border-radius:6px;background:var(--panel);overflow:hidden}
.compnav button{border:0;background:none;padding:6px 10px;cursor:pointer;color:var(--mute)}
.compnav button:hover{background:var(--acc-soft);color:var(--ink)}
.compnav strong{font:600 14px var(--f-c);min-width:92px;text-align:center;text-transform:capitalize}
.modo{font:500 11px var(--f-c);letter-spacing:.6px;text-transform:uppercase;padding:4px 8px;border-radius:99px;background:var(--neu-s);color:var(--mute)}
.modo.on{background:var(--ok-s);color:var(--ok)}
.btn{border:1px solid var(--line);background:var(--panel);padding:6px 11px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;display:inline-flex;gap:6px;align-items:center}
.btn:hover{border-color:var(--acc)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--acc-ink)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn.ghost{border-color:transparent;background:none}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,.tab:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.tabs{display:flex;gap:2px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.tab{border:0;background:none;padding:8px 12px;font:600 13px var(--f-c);color:var(--mute);border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--acc)}
.tab .ct{font:500 11px var(--f-m);background:var(--crit-s);color:var(--crit);border-radius:99px;padding:0 6px;margin-left:4px}
main{padding-top:14px;display:flex;flex-direction:column;gap:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:8px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:9px 11px;display:flex;flex-direction:column;gap:2px;cursor:pointer;text-align:left;border-top:3px solid var(--line)}
.kpi:hover{border-color:var(--acc)}
.kpi small{font:600 11px var(--f-c);text-transform:uppercase;letter-spacing:.6px;color:var(--mute)}
.kpi b{font:600 24px/1.1 var(--f-c);font-variant-numeric:tabular-nums}
.kpi em{font-style:normal;font-size:11px;color:var(--mute)}
.kpi.crit{border-top-color:var(--crit)}.kpi.crit b{color:var(--crit)}
.kpi.warn{border-top-color:var(--warn)}.kpi.warn b{color:var(--warn)}
.kpi.ok{border-top-color:var(--ok)}.kpi.info{border-top-color:var(--info)}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:980px){.grid2{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);min-width:0}
.card>h3{margin:0;padding:10px 12px;font:600 14px var(--f-c);display:flex;align-items:center;gap:8px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.card>h3 .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.card .bd{padding:10px 12px}
.hint{color:var(--mute);font-size:12px}
.scroll{overflow-x:auto}
table.t{border-collapse:collapse;width:100%;font-size:12.5px}
.t th{font:600 11px var(--f-c);text-transform:uppercase;letter-spacing:.5px;color:var(--mute);text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);background:var(--panel2);position:sticky;top:0;white-space:nowrap}
.t td{padding:5px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
.t tr:hover td{background:var(--panel2)}
.t .num,.num{font-family:var(--f-m);font-variant-numeric:tabular-nums;white-space:nowrap}
.t .fn{font-weight:600;font-family:var(--f-c);font-size:13px;line-height:1.2}
.sub{font-size:11px;color:var(--mute);display:flex;gap:6px;flex-wrap:wrap;margin-top:1px}
.pill{display:inline-block;font:600 11px var(--f-c);letter-spacing:.3px;padding:2px 7px;border-radius:4px;white-space:nowrap;background:var(--neu-s);color:var(--mute)}
.p-verif,.p-avenc,.p-qualif{background:var(--warn-s);color:var(--warn)}
.p-atras,.p-venc,.p-vencido{background:var(--crit-s);color:var(--crit)}
.p-lanc{background:var(--info-s);color:var(--info)}
.p-conc,.p-vig,.p-auto{background:var(--ok-s);color:var(--ok)}
.p-sugerido,.p-ambiguo{background:var(--info-s);color:var(--info)}
.p-semvinculo,.p-semLancamento,.p-outroCC{background:var(--crit-s);color:var(--crit)}
.chip{font:500 10.5px var(--f-c);text-transform:uppercase;letter-spacing:.4px;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--mute)}
.chip.miss{border-color:var(--warn);color:var(--warn)}
.flt{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line)}
.flt input[type=search],.flt select,.in{border:1px solid var(--line);background:var(--panel);border-radius:5px;padding:5px 8px;min-width:0}
.flt input[type=search]{flex:1 1 200px}
.in.sm{padding:2px 5px;font-size:12px}
.in.w-nf{width:78px}.in.w-v{width:96px;text-align:right;font-family:var(--f-m)}.in.w-doc{width:150px;font-family:var(--f-m)}
.in.miss{border-color:var(--warn);background:var(--warn-s)}
.tg{appearance:none;width:30px;height:17px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;vertical-align:middle;margin:0;transition:background .15s}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--panel);transition:transform .15s}
.tg:checked{background:var(--acc)}.tg:checked::after{transform:translateX(13px)}
.tgl{display:inline-flex;flex-direction:column;align-items:center;gap:1px;font-size:10px;color:var(--mute)}
.fila{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:4px minmax(0,1fr) auto;gap:10px;padding:7px 12px 7px 0;border-bottom:1px solid var(--line);align-items:center}
.al:last-child{border-bottom:0}
.al .sv{align-self:stretch;border-radius:0 3px 3px 0;background:var(--line)}
.al.n3 .sv{background:var(--crit)}.al.n2 .sv{background:var(--warn)}
.al .ti{font:600 11px var(--f-c);text-transform:uppercase;letter-spacing:.5px}
.al.n3 .ti{color:var(--crit)}.al.n2 .ti{color:var(--warn)}
.al .ac{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fch{border:1px solid var(--line);background:var(--panel);border-radius:99px;padding:2px 9px;font:500 12px var(--f-c);cursor:pointer}
.fch[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}
.cal .dh{font:600 10px var(--f-c);color:var(--mute);text-transform:uppercase;text-align:center;padding-bottom:2px}
.cal .d{border:1px solid var(--line);border-radius:5px;min-height:54px;padding:3px 4px;background:var(--panel2);cursor:pointer;display:flex;flex-direction:column;gap:2px;text-align:left}
.cal .d:hover{border-color:var(--acc)}
.cal .d.x{visibility:hidden}
.cal .d.hj{outline:2px solid var(--acc);outline-offset:-1px}
.cal .d b{font:600 12px var(--f-c)}
.cal .d i{font:500 10px var(--f-m);font-style:normal;border-radius:3px;padding:0 3px;align-self:flex-start}
.cal .pP{background:var(--info-s);color:var(--info)}.cal .pV{background:var(--neu-s);color:var(--mute)}
.cal .w2{background:var(--warn-s);color:var(--warn)}.cal .w3{background:var(--crit-s);color:var(--crit)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:11px;color:var(--mute);margin-top:8px}
.leg i{font-style:normal;font:500 10px var(--f-m);padding:0 4px;border-radius:3px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.form label{display:flex;flex-direction:column;gap:3px;font:600 11px var(--f-c);text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.form label.w2{grid-column:span 2}
@media (max-width:520px){.form label.w2{grid-column:auto}}
.form .in{font:13px var(--f-b);text-transform:none;letter-spacing:0;color:var(--ink);padding:6px 8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.bars{display:flex;flex-direction:column;gap:6px}
.bars .b{display:grid;grid-template-columns:minmax(90px,170px) minmax(0,1fr) auto;gap:8px;align-items:center;font-size:12px}
.bars .tr{height:12px;background:var(--neu-s);border-radius:3px;overflow:hidden}
.bars .fl{height:100%;background:var(--acc)}
.ind{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.ind div{display:flex;flex-direction:column}
.ind b{font:600 22px var(--f-c)}
.ind small{font:600 11px var(--f-c);text-transform:uppercase;letter-spacing:.5px;color:var(--mute)}
.meter{height:5px;border-radius:3px;background:var(--neu-s);margin-top:4px;overflow:hidden}.meter span{display:block;height:100%;background:var(--acc)}
.parse{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.parse span{font:500 11px var(--f-m);background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:2px 6px}
.parse span em{font-style:normal;color:var(--mute);margin-right:4px;font-family:var(--f-c);text-transform:uppercase}
.steps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px;max-width:80ch}
code{font:12px var(--f-m);background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:0 4px}
.empty{padding:22px 12px;text-align:center;color:var(--mute)}
#modal{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;display:flex;align-items:flex-start;justify-content:center;padding:max(24px,env(safe-area-inset-top,0px)) 16px 24px;overflow-y:auto}
#modal .box{background:var(--panel);border:1px solid var(--line);border-radius:10px;width:min(900px,100%);box-shadow:0 20px 50px rgba(0,0,0,.25)}
#modal .hd{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);font:600 15px var(--f-c)}
#modal .hd .btn{margin-left:auto}
#modal .ct{padding:14px;display:flex;flex-direction:column;gap:12px}
.mail{border:1px solid var(--line);border-radius:8px;overflow:hidden}
.mail .mh{padding:8px 10px;background:var(--panel2);display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:12px}
.mail pre{margin:0;padding:10px;white-space:pre-wrap;font:12px/1.5 var(--f-m);max-height:220px;overflow:auto}
#toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:6px;font-weight:500;z-index:60;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
#toast.err{background:var(--crit);color:#fff}
.busy{position:fixed;top:0;left:0;height:3px;background:var(--acc);z-index:70;animation:ld 1s linear infinite;width:30%}
@keyframes ld{from{transform:translateX(-100%)}to{transform:translateX(400%)}}
@media (prefers-reduced-motion:reduce){.busy{animation:none;width:100%}.tg,.tg::after{transition:none}}
.spark{display:block}
.warnbox{background:var(--warn-s);color:var(--warn);border-radius:6px;padding:8px 10px;font-size:12px}
</style>

async function buscarCNPJWeb(d) {

  if (itens.length && itens.every(x => x.erro) && modo() !== 'local') { toast('Navegador sem acesso à Receita; tentando pelo Google…'); const r2 = await act('consultarRegime', { ids }); return r2; }

}

   <label>Dia vencimento<input class="in" name="diaVenc" type="number" min="1" max="31" required value="${esc(c.diaVenc)}"></label>
   <label>Vigência até<input class="in" name="vigencia" type="date" value="${c.vigencia >= '2900' ? '' : esc(c.vigencia)}"></label>
   <label style="flex-direction:row;align-items:center;gap:6px;text-transform:none"><input type="checkbox" name="indet" ${c.vigencia >= '2900' ? 'checked' : ''}> Prazo indeterminado</label>
   <label>Valor de referência<input class="in" name="valorRef" inputmode="decimal" value="${esc(String(c.valorRef || '').replace('.', ','))}"></label>

  </form>`);

}

function bindConc() {

function vAnalise() {

  const ccs = Object.entries(porCC).sort((a, b) => b[1] - a[1]), mx = ccs.length ? ccs[0][1] : 1, tot = ccs.reduce((s, x) => s + x[1], 0);
  const m = (lbl, v, sub, p) => `<div><small>${lbl}</small><b>${v}</b><span class="hint">${sub}</span>${p != null ? `<div class="meter"><span style="width:${p}%"></span></div>` : ''}</div>`;
  return `<section class="card"><h3>Indicadores do processo <span class="hint">${comps.map(C.fmtComp).reverse().join(' – ')} · exclui histórico importado</span></h3><div class="bd ind">
   ${m('Lançados no prazo', pc(ind.noPrazo, ind.nLancData) + '%', 'até ' + CFG.tolDoc + 'd após a programação', pc(ind.noPrazo, ind.nLancData))}
   ${m('Atraso médio', ind.atrasoMed.toFixed(1).replace('.', ',') + ' d', 'programação → lançamento', null)}
   ${m('Lançados antes do vencimento', pc(ind.antesVenc, ind.lanc) + '%', ind.lanc + ' lançado(s) de ' + ind.total, pc(ind.antesVenc, ind.lanc))}
   ${m('Cobertura de PDF', pc(ind.pdf, ind.total) + '%', ind.pdf + ' de ' + ind.total + ' com documento na pasta', pc(ind.pdf, ind.total))}
  </div></section>
  <div class="grid2"><section class="card"><h3>Variação de valor por contrato <span class="hint">12 competências · alerta se |z| > 2 ou variação > ${CFG.varPct}% sobre a média anterior</span></h3>
   ${est.length ? `<div class="scroll"><table class="t"><thead><tr><th>Fornecedor</th><th>Série</th><th class="num">n</th><th class="num">Média</th><th class="num">Desvio</th><th class="num">CV</th><th class="num">Último</th><th class="num">Var.</th><th></th></tr></thead><tbody>${est.map(e => `<tr><td><div class="fn">${esc(e.c ? e.c.fornecedor : '')}</div><div class="sub">${esc(e.c ? e.c.cc : '')}</div></td><td>${sparkline(e.serie.map(s => s.v))}</td><td class="num">${e.n}</td><td class="num">${C.moeda(e.media)}</td><td class="num">${C.moeda(e.dp)}</td><td class="num">${e.cv.toFixed(0)}%</td><td class="num">${C.moeda(e.ult)}</td><td class="num" style="color:${e.varp > 0 ? 'var(--crit)' : 'var(--ok)'}">${e.varp == null ? '' : (e.varp > 0 ? '+' : '') + e.varp.toFixed(1).replace('.', ',') + '%'}</td><td>${e.alerta ? '<span class="pill p-venc">fora do padrão</span>' : ''}</td></tr>`).join('')}</tbody></table></div>` : `<div class="empty">Ainda não há valores registrados. Eles entram quando alguém preenche a coluna Valor em Lançamentos ou quando a conciliação lê o valor no nome do PDF.</div>`}</section>
  <section class="card"><h3>Valor por centro de custo · ${C.fmtComp(COMP)}</h3><div class="bd">${ccs.length ? `<div class="bars">${ccs.map(([k, v]) => `<div class="b"><span>${esc(k)}</span><div class="tr"><div class="fl" style="width:${(v / mx * 100).toFixed(1)}%"></div></div><span class="num">${C.moeda(v)}</span></div>`).join('')}</div><p class="hint" style="margin:10px 0 0">Total: <b class="num">${C.moeda(tot)}</b></p>` : '<div class="empty">Sem valores nesta competência.</div>'}</div></section></div>`;

  </div></section>
  <section class="card"><h3>Implantação (uma vez)</h3><div class="bd"><ol class="steps">
   <li>Na planilha do Google Sheets com as abas mensais: <b>Extensões › Apps Script</b>.</li>
   <li>Cole o conteúdo de <code>Code.gs</code> no arquivo Código.gs e crie um arquivo HTML chamado <code>Index</code> com o conteúdo de <code>Index.html</code>.</li>
   <li>Rode a função <code>configurar</code> e autorize (Planilhas, Drive e Gmail). Ela cria as abas CONTRATOS, LANCAMENTOS, RESPONSAVEIS, CONFIG e LOG, importa a aba mais recente e agenda a rotina diária.</li>
   <li>Preencha e-mails dos responsáveis, o e-mail do gestor e o ID da pasta de documentos lançados (o trecho da URL do Drive depois de <code>/folders/</code>).</li>
   <li><b>Implantar › Nova implantação › App da Web</b> (executar como: você; acesso: sua organização). A URL abre este painel já conectado. A planilha também ganha o menu <b>Contratos</b>.</li>
   <li>Todo dia às ${CFG.horaEnvio}h a rotina gera a competência, lê a pasta, vincula os PDFs e envia os alertas por e-mail. As abas mensais antigas não são alteradas.</li>
  </ol></div></section>
  <section class="card"><h3>Registro de atividades</h3><div class="scroll" style="max-height:260px"><table class="t"><tbody>${DB.log.slice(-25).reverse().map(l => `<tr><td class="num hint">${esc(l.quando)}</td><td>${esc(l.acao)}</td><td class="hint">${esc(l.detalhe)}</td></tr>`).join('') || '<tr><td class="empty">Sem registros</td></tr>'}</tbody></table></div></section>
  </div></div>`;
}
const linhaResp = r => `<tr><td><input class="in sm" name="nome" value="${esc(r.nome)}" style="width:100%"></td><td><input class="in sm" name="email" type="email" value="${esc(r.email)}" style="width:100%" placeholder="nome@empresa.com.br"></td><td><button class="btn ghost sm" type="button" data-act="rmR">✕</button></td></tr>`;
function importarX(inp) {
  const f = inp.files[0]; if (!f) return; if (!window.XLSX) return toast('Biblioteca de planilha não carregou', 1);
  const rd = new FileReader(); rd.onload = async e => {
    const wb = XLSX.read(e.target.result, { type: 'array', cellDates: true });
    const tabs = wb.SheetNames.map(n => ({ nome: n, linhas: XLSX.utils.sheet_to_json(wb.Sheets[n], { header: 1, raw: true, defval: '' }).filter(r => r.slice(0, 3).some(x => x !== '')).map(r => r.slice(0, 30).map(v => v instanceof Date ? C.iso(v.getFullYear(), v.getMonth() + 1, v.getDate()) : v)) }));
    await act('migrar', { tabs, substituir: $('#subst').checked });
  }; rd.readAsArrayBuffer(f);
}

/* ---------- pasta do SOLUS lembrada pelo navegador (File System Access) ---------- */
const IDB = {
  abrir() { return new Promise((res, rej) => { const r = indexedDB.open('contratos-rec', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); },
  async get(k) { try { const db = await IDB.abrir(); return await new Promise(res => { const t = db.transaction('kv').objectStore('kv').get(k); t.onsuccess = () => res(t.result || null); t.onerror = () => res(null); }); } catch (e) { return null; } },
  async set(k, v) { try { const db = await IDB.abrir(); await new Promise(res => { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = res; t.onerror = res; }); } catch (e) {} }
};
const MESES_P = ['JANEIRO', 'FEVEREIRO', 'MARCO', 'ABRIL', 'MAIO', 'JUNHO', 'JULHO', 'AGOSTO', 'SETEMBRO', 'OUTUBRO', 'NOVEMBRO', 'DEZEMBRO'];
let PASTA_ESTADO = 'sem';
async function lerHandle(dir) {
  const out = [], cur = HOJE.slice(0, 7), prev = C.compSoma(cur, -1);
  const mesOk = n => { const u = C.norm(n), i = MESES_P.findIndex(m => (' ' + u + ' ').includes(' ' + m + ' ')); if (i < 0) return null; const cp = HOJE.slice(0, 4) + '-' + String(i + 1).padStart(2, '0'); return cp === cur || cp === prev; };
  const base = (CFG.pastaLocal || dir.name).replace(/\\+$/, '');
  async function walk(d, path, depth) {
    for await (const [name, h] of d.entries()) {
      if (h.kind === 'file') { if (/\.pdf$/i.test(name) && !/^RELAT/i.test(name)) out.push({ nome: name, caminho: path + '\\' + name, data: '', url: '' }); }
      else if (depth < 4 && mesOk(name) !== false && !/RELAT[OÓ]RIO/i.test(name)) await walk(h, path + '\\' + name, depth + 1);
    }
  }
  await walk(dir, base, 0); return out;
}
async function lerPastaSolus(interativo) {
  let emFrame = false; try { emFrame = window.self !== window.top; } catch (e) { emFrame = true; }
  if (!window.showDirectoryPicker || emFrame) { if (interativo) toast(emFrame ? 'Pelo link do Google o navegador não pode lembrar a pasta. Abra o painel pelo site ou pelo arquivo Contratos-Recorrentes-local.html.' : 'Este navegador não lembra pastas. Use o Chrome ou o Edge, ou "Selecionar pasta do computador".', 1); PASTA_ESTADO = 'semsuporte'; return; }
  let h = await IDB.get('pastaSolus');
  if (!h) { if (!interativo) { PASTA_ESTADO = 'sem'; return; } try { h = await window.showDirectoryPicker({ id: 'solus', mode: 'read' }); } catch (e) { return; } await IDB.set('pastaSolus', h); }
  let perm = await h.queryPermission({ mode: 'read' });
  if (perm !== 'granted') { if (!interativo) { PASTA_ESTADO = 'permissao'; renderTabsOnly(); return; } perm = await h.requestPermission({ mode: 'read' }); if (perm !== 'granted') { PASTA_ESTADO = 'permissao'; return; } }
  PASTA_ESTADO = 'lendo'; toast('Lendo a pasta do SOLUS (' + h.name + ')…');
  let arqs; try { arqs = await lerHandle(h); } catch (e) { PASTA_ESTADO = 'erro'; toast('Não consegui ler a pasta: ' + e.message + '. Confira se a unidade S: está conectada.', 1); return; }
  const r = await act('conciliar', { arquivos: arqs, aplicarAuto: true, resumo: true }, { noRender: true });
  PASTA_ESTADO = 'ok';
  if (r && r.ok) { CONC = { resultado: r.resultado, lidos: r.lidos }; render(); if (r.resumoEnviado) toast(r.msg + ' · resumo enviado para ' + r.resumoEnviado); }
}
async function trocarPastaSolus() { await IDB.set('pastaSolus', null); lerPastaSolus(true); }
function renderTabsOnly() { if (ABA === 'painel') render(); }

/* ---------- chave de acesso ---------- */
function pedirChave() {
  modal('Acesso restrito', `<form id="fK" class="form"><p class="hint" style="grid-column:1/-1;margin:0">Este painel controla os contratos recorrentes da Suprimentos. Informe a chave de acesso fornecida pelo gestor. Ela fica salva neste navegador.</p><label class="w2">Chave de acesso<input class="in" id="kIn" type="password" autocomplete="current-password" required></label><div class="row" style="grid-column:1/-1"><button class="btn pri" type="submit">Entrar</button></div></form>`);
  $('#fK').addEventListener('submit', e => { e.preventDefault(); CONEX.token = $('#kIn').value.trim(); LS.set('cr_conexao', CONEX); fecharModal(); boot(); });
  setTimeout(() => $('#kIn') && $('#kIn').focus(), 50);
}
function sairChave() { CONEX.token = ''; LS.set('cr_conexao', CONEX); location.reload(); }

/* ---------- modal e e-mails ---------- */
function modal(t, h) { $('#mT').textContent = t; $('#mC').innerHTML = h; $('#modal').hidden = false; }
function fecharModal() { $('#modal').hidden = true; }
function mostrarEmails(ms, enviados) {
  const local = modo() === 'local';
  modal(enviados ? 'E-mails enviados' : 'Prévia dos e-mails de alerta', (local ? `<div class="warnbox">Modo local: o envio automático acontece pelo Apps Script (Gmail) com a planilha conectada. Aqui você pode copiar o texto ou abrir no seu e-mail.</div>` : '') +
    (ms.length ? ms.map((m, i) => `<div class="mail"><div class="mh"><b>Para:</b><span class="num">${esc(m.para) || '<span class="chip miss">sem e-mail cadastrado</span>'}</span>${m.cc ? `<b>Cc:</b><span class="num">${esc(m.cc)}</span>` : ''}<span class="pill">${m.qtd} item(ns)</span><span style="margin-left:auto" class="row"><button class="btn sm" data-act="copiar" data-i="${i}">Copiar texto</button>${m.para ? `<a class="btn sm" href="mailto:${encodeURIComponent(m.para)}?subject=${encodeURIComponent(m.assunto)}&body=${encodeURIComponent(m.texto)}">Abrir no e-mail</a>` : ''}</span></div><div style="padding:8px 10px 0;font-weight:600">${esc(m.assunto)}</div><pre>${esc(m.texto)}</pre></div>`).join('') : '<div class="empty">Nenhum alerta a enviar hoje.</div>') +
    (!local && !enviados && ms.length ? `<div class="row"><button class="btn pri" data-act="enviarJa">Enviar ${ms.filter(m => m.para).length} e-mail(s) agora</button><span class="hint">Itens de responsáveis sem e-mail vão para o gestor.</span></div>` : ''));
  window._emails = ms;
}

/* ---------- eventos ---------- */
function upd(id, campos) { return act('atualizarLancamentos', { itens: [{ id, campos }] }, { silent: true }); }
document.addEventListener('click', async e => {
  const b = e.target.closest('[data-aba],[data-act],[data-go],[data-dia],[data-fa]'); if (!b) return;
  if (b.dataset.aba) { ABA = b.dataset.aba; LS.set('cr_aba', ABA); render(); window.scrollTo(0, 0); return; }
  if (b.dataset.go) { const [a, st] = b.dataset.go.split('|'); ABA = a; if (a === 'lanc') F = { q: '', resp: '', cc: '', st, dia: '' }; if (a === 'contratos') FC.vig = st; render(); return; }
  if (b.dataset.dia) { F = { q: '', resp: '', cc: '', st: '', dia: b.dataset.dia }; ABA = 'lanc'; render(); return; }
  if (b.dataset.fa != null && !b.dataset.act) { FA = b.dataset.fa; render(); return; }
  const a = b.dataset.act, id = b.dataset.id;
  if (a === 'fechar') fecharModal();
  else if (a === 'gerar') act('gerarCompetencia', { comp: COMP });
  else if (a === 'marca') upd(id, { [b.dataset.f]: 'S' });
  else if (a === 'cobrar') { const r = await act('cobrar', { id }, { noRender: true }); if (r && r.ok && modo() === 'local') mostrarEmails(r.emails); }
  else if (a === 'desv') act('desvincular', { id });
  else if (a === 'limpaDia') { F.dia = ''; render(); }
  else if (a === 'lote') { await act('atualizarLancamentos', { itens: [...SEL].map(id => ({ id, campos: { [b.dataset.f]: 'S' } })) }); SEL.clear(); render(); }
  else if (a === 'loteCobrar') { const all = []; for (const id of SEL) { const r = await act('cobrar', { id }, { noRender: true, silent: true }); if (r && r.ok) all.push(...r.emails); } SEL.clear(); render(); if (modo() === 'local') mostrarEmails(all); else toast(all.length + ' cobrança(s) enviada(s)'); }
  else if (a === 'lerSolus') lerPastaSolus(true);
  else if (a === 'trocarSolus') trocarPastaSolus();
  else if (a === 'novoC') formContrato(null);
  else if (a === 'regTodos') consultarRegimes(null);
  else if (a === 'reg1') { await consultarRegimes([id]); const c = DB.contratos.find(x => x.id === id); if (c && $('#regBox')) $('#regBox').innerHTML = celRegime(c); }
  else if (a === 'editC') formContrato(DB.contratos.find(c => c.id === id));
  else if (a === 'exC1') $('#exWrap').innerHTML = `<button class="btn" type="button" data-act="exC2" style="border-color:var(--crit);color:var(--crit)">Confirmar exclusão</button>`;
  else if (a === 'exC2') { const r = await act('excluirContrato', { id: $('#fC [name=id]').value }); if (r && r.ok) fecharModal(); }
  else if (a === 'lerDrive') conciliarArqs([]);
  else if (a === 'lerColar') { const arr = $('#colar').value.split(/\r?\n/).map(s => s.trim()).filter(s => /\.pdf$/i.test(s)).map(s => ({ nome: s.split(/[\\\/]/).pop(), caminho: s, data: '', url: '' })); if (!arr.length) return toast('Cole ao menos um caminho terminado em .pdf', 1); conciliarArqs(arr); }
  else if (a === 'vinc1' || a === 'vincTodos') {
    const trs = a === 'vinc1' ? [b.closest('tr')] : [...document.querySelectorAll('tr[data-ix]')].filter(tr => tr.querySelector('.lsel') && tr.querySelector('.lsel').value);
    const v = trs.map(tr => { const x = CONC.resultado[+tr.dataset.ix], sel = tr.querySelector('.lsel'); return sel && sel.value ? { x, lancId: sel.value } : null; }).filter(Boolean);
    if (!v.length) return toast('Escolha o lançamento na lista antes de vincular', 1);
    const r = await act('vincular', { vinculos: v.map(o => ({ lancId: o.lancId, arq: o.x.arq, p: o.x.p })), aprender: $('#aprender').checked }, { noRender: true });
    if (r && r.ok) { v.forEach(o => { o.x.aplicado = true; o.x.lancId = o.lancId; }); render(); }
  }
  else if (a === 'addR') $('#rBody').insertAdjacentHTML('beforeend', linhaResp({ nome: '', email: '' }));
  else if (a === 'rmR') b.closest('tr').remove();
  else if (a === 'salvaApi') { CONEX.api = $('#apiUrl').value.trim(); CONEX.token = $('#apiTok').value.trim(); LS.set('cr_conexao', CONEX); boot(); }
  else if (a === 'limpaApi') { CONEX.api = ''; CONEX.token = ''; LS.set('cr_conexao', CONEX); boot(); }
  else if (a === 'copiar') { const m = window._emails[+b.dataset.i], txt = m.assunto + '\n\n' + m.texto; try { await navigator.clipboard.writeText(txt); toast('Texto copiado'); } catch (err) { const pre = b.closest('.mail').querySelector('pre'); const s = getSelection(), rg = document.createRange(); rg.selectNodeContents(pre); s.removeAllRanges(); s.addRange(rg); toast('Selecionado: use Ctrl+C'); } }
  else if (a === 'copiaCmd') { const tx = $('#cmdDir').textContent; try { await navigator.clipboard.writeText(tx); toast('Comando copiado'); } catch (err) { const s = getSelection(), rg = document.createRange(); rg.selectNodeContents($('#cmdDir')); s.removeAllRanges(); s.addRange(rg); toast('Selecionado: use Ctrl+C'); } }
  else if (a === 'enviarJa') { const r = await act('enviarAlertas', { forcar: true }, { noRender: true }); if (r && r.ok) mostrarEmails(r.emails, true); }
});
document.addEventListener('change', e => {
  const t = e.target, tr = t.closest('tr[data-id]'), trc = t.closest('tr[data-cid]');
  if (t.id === 'fq' || t.id === 'fresp' || t.id === 'fcc' || t.id === 'fst') { F[{ fq: 'q', fresp: 'resp', fcc: 'cc', fst: 'st' }[t.id]] = t.value; render(); return; }
  if (t.id === 'cq' || t.id === 'ccc' || t.id === 'cvig' || t.id === 'cat') { FC[{ cq: 'q', ccc: 'cc', cvig: 'vig', cat: 'ativo' }[t.id]] = t.value; render(); return; }
  if (t.id === 'selAll') { document.querySelectorAll('tr[data-id]').forEach(r => t.checked ? SEL.add(r.dataset.id) : SEL.delete(r.dataset.id)); render(); return; }
  if (tr && t.classList.contains('sel')) { t.checked ? SEL.add(tr.dataset.id) : SEL.delete(tr.dataset.id); render(); return; }
  if (tr && t.dataset.f) { const f = t.dataset.f; upd(tr.dataset.id, { [f]: t.type === 'checkbox' ? (t.checked ? 'S' : '') : t.value }); return; }
  if (trc && t.dataset.cf) { const c = { ...DB.contratos.find(x => x.id === trc.dataset.cid) }; c[t.dataset.cf] = t.type === 'checkbox' ? (t.checked ? 'S' : 'N') : C.dig(t.value); act('salvarContrato', { contrato: c, gerar: c.ativo === 'S' }).then(r => { if (r && r.ok && t.dataset.cf === 'doc' && C.dig(c.doc).length === 14) consultarRegimes([c.id]); }); }
});
document.addEventListener('input', e => { if (e.target.id === 'fq' || e.target.id === 'cq') { clearTimeout(window._qt); const t = e.target; window._qt = setTimeout(() => { if (t.id === 'fq') F.q = t.value; else FC.q = t.value; const pos = t.selectionStart; render(); const n = $('#' + t.id); n.focus(); n.setSelectionRange(pos, pos); }, 250); } });
document.addEventListener('submit', async e => {
  if (e.target.id === 'fR') { e.preventDefault(); const lista = [...e.target.querySelectorAll('#rBody tr')].map(tr => ({ nome: tr.querySelector('[name=nome]').value.trim(), email: tr.querySelector('[name=email]').value.trim() })); act('salvarResponsaveis', { lista }); }
  if (e.target.id === 'fP') { e.preventDefault(); act('salvarConfig', { config: Object.fromEntries(new FormData(e.target).entries()) }); }
});
$('#modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !$('#modal').hidden) fecharModal(); });
$('#cPrev').onclick = () => { COMP = C.compSoma(COMP, -1); SEL.clear(); render(); };
$('#cNext').onclick = () => { COMP = C.compSoma(COMP, 1); SEL.clear(); render(); };
$('#bAlertas').onclick = async () => { const r = await act('previaAlertas', { forcar: true }, { noRender: true, silent: true }); if (r && r.ok) mostrarEmails(r.emails); };

async function boot() {
  if (modo() === 'local') {
    const s = LS.get('cr_db');
    if (s && s.contratos && s.contratos.length) setDB(s);
    else if (SEED.length) { setDB({ contratos: [], lancamentos: [], responsaveis: [], config: [], log: [] }); C.executar(DB, 'migrar', { tabs: SEED, substituir: true }, { hoje: HOJE, enviarEmail: () => true }); LS.set('cr_db', DB); }
  } else {
    const r = await act('carregar', {}, { noRender: true, silent: true }); if (!r || !r.ok) { ABA = 'config'; render(); return; }
  }
  if (!lancsComp(HOJE.slice(0, 7)).length && DB.contratos.length) await act('gerarCompetencia', { comp: HOJE.slice(0, 7) }, { silent: true, noRender: true });
  render();
  if (modo() !== 'local' && DB.contratos.length) lerPastaSolus(false);
}
boot();
</script>
